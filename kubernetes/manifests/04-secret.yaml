# 04 — Secret
# Stores sensitive data (passwords, tokens, connection strings).
# Values must be base64-encoded.
#
# Encode a value:   echo -n "your-value" | base64
# Decode a value:   echo "encoded" | base64 --decode
#
# Example value format for a lab deployment:
#   postgresql://<db-user>:<db-password>@postgres:5432/employees
#
# In production this Secret is created by External Secrets Operator
# from AWS Secrets Manager — you never apply this file on EKS.
#
# Apply:   kubectl apply -f 04-secret.yaml
# Check:   kubectl get secret db-credentials -n employee-app
# Inspect: kubectl describe secret db-credentials -n employee-app
# Decode:  kubectl get secret db-credentials -n employee-app -o jsonpath='{.data.DATABASE_URL}' | base64 --decode

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: employee-app
type: Opaque
stringData:
  DATABASE_URL: "postgresql://REPLACE_WITH_DB_USER:REPLACE_WITH_STRONG_PASSWORD@postgres:5432/employees"
